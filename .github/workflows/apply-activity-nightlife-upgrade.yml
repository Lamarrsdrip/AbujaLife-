name: Apply activity and nightlife upgrade

on:
  push:
    branches: [fix/world-stability-and-fast-taps-2026-10-05]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-stability-and-fast-taps-2026-10-05
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply gameplay upgrade safely
        run: node scripts/apply-activity-nightlife-upgrade.mjs
      - name: Align gameplay regressions with the new timing contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          generated = Path('tests/activity-nightlife-upgrade.test.mjs')
          text = generated.read_text()
          replacements = [
              ("  assert.match(interiors,/club dance floor crowd/);", "  assert.ok((interiors.match(/activity:'dance'/g)||[]).length>=10);"),
              ("  assert.match(world3d,/const clubLights=[]/);", r"  assert.match(world3d,/const clubLights=\[\]/);"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'generated regression target missing: {old}')
              text = text.replace(old, new)
          generated.write_text(text)

          preview = Path('tests/preview-v4.test.mjs')
          text = preview.read_text()
          old_quote = 'assert.equal(quote.seconds, 4);'
          old_modes = '{ destination: district, mode, cost, seconds: 4, venueId: "restaurant" });'
          if text.count(old_quote) != 1 or text.count(old_modes) != 1:
              raise SystemExit('preview travel timing regression target missing or ambiguous')
          text = text.replace(old_quote, 'assert.equal(quote.seconds, 14);')
          text = text.replace(old_modes, '{ destination: district, mode, cost, seconds: 14, venueId: "restaurant" });')
          preview.write_text(text)
          PY
      - name: Check generated diff
        run: git diff --check
      - name: Run unit and static QA
        run: npm run qa
      - name: Build production bundle
        run: npm run build
      - name: Commit verified upgrade
        shell: bash
        run: |
          rm -f scripts/apply-activity-nightlife-upgrade.mjs .github/workflows/apply-activity-nightlife-upgrade.yml
          git config user.name "AbujaLife CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: make activities longer and nightlife feel alive [verified]"
          git push origin HEAD:fix/world-stability-and-fast-taps-2026-10-05