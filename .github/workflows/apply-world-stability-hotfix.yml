name: Apply world stability hotfix

on:
  push:
    branches: [fix/world-stability-and-fast-taps-2026-10-05]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-stability-and-fast-taps-2026-10-05
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply hotfix safely
        run: node scripts/apply-world-stability-hotfix.mjs
      - name: Check generated diff
        run: git diff --check
      - name: Run unit and static QA
        run: npm run qa
      - name: Build production bundle
        run: npm run build
      - name: Commit verified fix
        shell: bash
        run: |
          rm -f scripts/apply-world-stability-hotfix.mjs .github/workflows/apply-world-stability-hotfix.yml
          git config user.name "AbujaLife CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep 3D world stable and make taps immediate [hotfix-applied]"
          git push origin HEAD:fix/world-stability-and-fast-taps-2026-10-05
