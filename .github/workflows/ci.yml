name: AbujaLife CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run qa
      - name: Reject accidental Unity generated folders
        run: |
          test ! -d game-unity/Library
          test ! -d game-unity/Temp
          test ! -d game-unity/Builds
          test ! -d node_modules
