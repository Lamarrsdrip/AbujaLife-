name: AbujaLife CI

on:
  push:
    branches: [main, infra/abujalife-vps-hostinger-production]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run qa
      - run: node --test deploy/windows/runtime.test.mjs
      - run: npm run build
      - run: npm run qa:infra

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run qa
      - run: node --test deploy/windows/runtime.test.mjs
      - run: npm run build
      - name: Parse production PowerShell helpers
        shell: pwsh
        run: |
          Get-ChildItem deploy -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "Invalid PowerShell: $($_.Name)" }
          }
