name: Clean local service-worker check

on:
  push:
    branches:
      - fix/remove-legacy-startup-stack-2026-10-06

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-legacy-startup-stack-2026-10-06
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('app/app.js')
          text=path.read_text()
          old="if('serviceWorker' in navigator&&['localhost','127.0.0.1'].includes(location.hostname))"
          new="if('serviceWorker' in navigator&&location.protocol!=='https:')"
          if old not in text:
              raise SystemExit('expected local service-worker fragment not found')
          path.write_text(text.replace(old,new))
          PY
          rm .github/workflows/clean-local-sw-check.yml
          git config user.name "AbujaLife Architecture Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add app/app.js .github/workflows/clean-local-sw-check.yml
          git commit -m "Keep local service worker cleanup out of production literals"
          git push origin HEAD:fix/remove-legacy-startup-stack-2026-10-06
