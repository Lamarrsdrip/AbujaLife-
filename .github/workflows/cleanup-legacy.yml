name: Remove legacy AbujaLife prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-legacy.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove superseded Unity-era foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AbujaLife Rebuild'
          git config user.email 'actions@users.noreply.github.com'
          git rm -r --ignore-unmatch game-unity services data infra tools docs BUILD_COMMIT.txt
          if git diff --cached --quiet; then
            echo 'Legacy prototype already clean.'
            exit 0
          fi
          git commit -m 'rebuild: remove superseded Unity prototype'
          git push origin HEAD:main
