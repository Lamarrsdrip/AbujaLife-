name: Direct session runtime migration

on:
  push:
    branches:
      - fix/remove-legacy-startup-stack-2026-10-06

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-legacy-startup-stack-2026-10-06
          fetch-depth: 0
      - name: Apply migration
        shell: bash
        run: |
          python3 scripts/direct-session-migration.py
          python3 -c "from pathlib import Path; p=Path('src/server/sessionRuntime.mjs'); p.write_text(p.read_text().rstrip()+'\n')"
          rm -f scripts/direct-session-migration.py
          rm -f .github/workflows/direct-session-runtime-migration.yml
          git config user.name "AbujaLife Architecture Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add src/server/production-http.mjs src/server/http.mjs src/server/production.mjs src/server/sessionRuntime.mjs scripts/dev.mjs tests/session-runtime.test.mjs tests/production-integration.mjs scripts/direct-session-migration.py .github/workflows/direct-session-runtime-migration.yml
          git diff --cached --check
          git commit -m "Make session runtime the only auth dispatcher"
          git push origin HEAD:fix/remove-legacy-startup-stack-2026-10-06