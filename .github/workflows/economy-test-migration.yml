name: Economy test migration

on:
  push:
    branches: [integration/signup-economy-main-2026-10-05-v4]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/signup-economy-main-2026-10-05-v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebaseline only stale economy assertions
        run: node scripts/rebaseline-economy-tests.mjs
      - name: Full application QA
        run: npm run qa
      - name: Windows runtime contract
        run: node --test deploy/windows/runtime.test.mjs
      - name: Production build
        run: npm run build
      - name: Full Mongo/infrastructure QA
        run: npm run qa:infra
      - name: Commit verified test migration and remove temporary migration machinery
        shell: bash
        run: |
          git rm .github/workflows/economy-test-migration.yml scripts/rebaseline-economy-tests.mjs
          git add tests
          git config user.name "GhostDev"
          git config user.email "110933245+Lamarrsdrip@users.noreply.github.com"
          git commit -m "test: align economy coverage with scaled balances and prices"
          git push origin HEAD:integration/signup-economy-main-2026-10-05-v4
