name: AbujaLife frontend deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    concurrency:
      group: abujalife-frontend-production
      cancel-in-progress: true
    steps:
      - name: Check out the production source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Build the connected production game
        run: npm run build

      - name: Publish the build artifact branch
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/RELEASE.json
          test -f dist/runtime-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmp_dir="$(mktemp -d)"
          cp -R dist/. "$tmp_dir/"
          cd "$tmp_dir"
          git init -q
          git add -A
          git commit -qm "Deploy AbujaLife frontend ${GITHUB_SHA}"
          git branch -M hostinger-production
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hostinger-production
