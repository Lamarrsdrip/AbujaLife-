name: AbujaLife frontend release validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    concurrency:
      group: abujalife-frontend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the production source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Build the connected production game
        run: npm run build

      - name: Add release manifest and stage the static artifact
        run: |
          python3 deploy/package-frontend.py /tmp/abujacity-production-frontend.zip
          mkdir -p /tmp/abujalife-frontend-artifact
          unzip -q /tmp/abujacity-production-frontend.zip -d /tmp/abujalife-frontend-artifact

      - name: Verify the static site ships in the VPS release
        run: |
          test -f /tmp/abujalife-frontend-artifact/index.html
          test -f /tmp/abujalife-frontend-artifact/RELEASE.json
          test -f /tmp/abujalife-frontend-artifact/runtime-config.js
          python3 -c "import json; p='/tmp/abujalife-frontend-artifact/RELEASE.json'; d=json.load(open(p)); assert d['revision']=='${GITHUB_SHA}'; print('Verified frontend release:', d['revision'])"
