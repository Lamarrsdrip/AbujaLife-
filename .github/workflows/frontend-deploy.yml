name: AbujaLife frontend deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    concurrency:
      group: abujalife-frontend-production
      cancel-in-progress: true
    steps:
      - name: Check out the production source
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Build the connected production game
        run: npm run build

      - name: Add release manifest and stage the static artifact
        run: |
          python3 deploy/package-frontend.py /tmp/abujacity-production-frontend.zip
          mkdir -p /tmp/abujalife-frontend-artifact
          unzip -q /tmp/abujacity-production-frontend.zip -d /tmp/abujalife-frontend-artifact

      - name: Publish the build artifact branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/abujalife-frontend-artifact/index.html
          test -f /tmp/abujalife-frontend-artifact/RELEASE.json
          test -f /tmp/abujalife-frontend-artifact/runtime-config.js
          tmp_dir="$(mktemp -d)"
          cp -R /tmp/abujalife-frontend-artifact/. "$tmp_dir/"
          cd "$tmp_dir"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy AbujaLife frontend ${GITHUB_SHA}"
          git branch -M hostinger-production
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hostinger-production
