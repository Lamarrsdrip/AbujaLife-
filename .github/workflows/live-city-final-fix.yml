name: Live City Final Fix

on:
  push:
    branches: [integration/live-city-latest-main-2026-10-05]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[final-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/live-city-latest-main-2026-10-05
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/live-city-final-fix.mjs
      - name: Commit final product-only patch
        shell: bash
        run: |
          git config user.name "GhostDev"
          git config user.email "110933245+Lamarrsdrip@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete live city encounter contracts [final-fix-applied]"
          git push origin HEAD:integration/live-city-latest-main-2026-10-05
