name: Materialize final Abuja city visual source

on:
  push:
    branches: [fix/final-world-phone-house-stats-2026-10-06]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'render the full Abuja city in playable WebGL') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-world-phone-house-stats-2026-10-06
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize full playable Abuja city
        run: python -X utf8 scripts/final-city-visual-pass.py
      - name: Remove one-time materializer
        run: |
          rm -f scripts/final-city-visual-pass.py
          rm -f .github/workflows/materialize-final-city-visual.yml
      - run: npm ci --ignore-scripts
      - name: Full Node QA
        run: npm run qa
      - name: Windows runtime contract
        run: node --test deploy/windows/runtime.test.mjs
      - name: Production build
        run: npm run build
      - name: Infrastructure QA
        run: npm run qa:infra
      - name: Source integrity
        run: git diff --check
      - name: Commit real source
        run: |
          git config user.name GhostDev
          git config user.email 110933245+Lamarrsdrip@users.noreply.github.com
          git add -A
          git commit -m "fix: render the full Abuja city in playable WebGL"
          git push origin HEAD:fix/final-world-phone-house-stats-2026-10-06
