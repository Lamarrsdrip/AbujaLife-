name: Materialize phone restoration

on:
  push:
    branches: [fix/restore-phone-kit-drive-home-2026-10-07]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply exact source changes
        run: node scripts/materialize-restore-phone-drive-home.mjs
      - name: Verify Node QA
        run: npm run qa
      - name: Verify Windows runtime contract
        run: node --test deploy/windows/runtime.test.mjs
      - name: Verify production build
        run: npm run build
      - name: Verify infrastructure
        run: npm run qa:infra
      - name: Source integrity
        run: git diff --check
      - name: Commit clean product source
        shell: bash
        run: |
          rm scripts/materialize-restore-phone-drive-home.mjs
          rm .github/workflows/materialize-restore-phone-drive-home.yml
          git config user.name "GhostDev"
          git config user.email "110933245+Lamarrsdrip@users.noreply.github.com"
          git add app/app.js app/phone.css app/phone-chat-pro.js app/phone-chat-pro.css tests/final-world-phone-regression.test.mjs scripts/materialize-restore-phone-drive-home.mjs .github/workflows/materialize-restore-phone-drive-home.yml
          git commit -m "fix: restore phone kit and offer drive home"
          git push origin HEAD:fix/restore-phone-kit-drive-home-2026-10-07
