name: Materialize World landmarks ads civic source

on:
  push:
    branches: [fix/world-landmarks-ads-civic-2026-10-06]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-landmarks-ads-civic-2026-10-06
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply direct source implementation
        run: python -X utf8 scripts/materialize-world-landmarks-ads-civic.py
      - name: Remove one-time materializer
        run: |
          rm -f scripts/materialize-world-landmarks-ads-civic.py
          rm -f .github/workflows/materialize-world-landmarks-ads-civic.yml
      - run: npm ci --ignore-scripts
      - name: Full Node QA
        run: npm run qa
      - name: Windows runtime contract
        run: node --test deploy/windows/runtime.test.mjs
      - name: Production build
        run: npm run build
      - name: Infrastructure QA
        run: npm run qa:infra
      - name: Commit only the real source and regression test
        run: |
          git diff --check
          git config user.name GhostDev
          git config user.email 110933245+Lamarrsdrip@users.noreply.github.com
          git add -A
          git commit -m "fix: surface Abuja landmarks ad land and City Story"
          git push origin HEAD:fix/world-landmarks-ads-civic-2026-10-06
