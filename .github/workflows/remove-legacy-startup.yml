name: Remove legacy AbujaLife startup stack

on:
  push:
    branches:
      - fix/remove-legacy-startup-stack-2026-10-06

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-legacy-startup-stack-2026-10-06
      - name: Remove legacy client startup calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/app.js')
          text = path.read_text()
          replacements = [
              ("'/api/bootstrap?startup=1'", "'/api/entry'"),
              ("if(!state.authenticated||!state.startup)return;", "if(!state.authenticated||!state.entry)return;"),
              ("if(!next.authenticated){expireAccount();return;}", "if(!next.authenticated)return;"),
              (".catch(error=>{if(epoch===stateRequestEpoch&&error.status===401)expireAccount();});", ".catch(()=>{});"),
              ("authMode=b.dataset.mode;authError='';authDraft.password='';renderMain();", "authMode=b.dataset.mode;authError='';authNotice='';authDraft.password='';renderMain();"),
              ("state=await api('/api/bootstrap');authMode='login';renderMain();", "state=await api('/api/entry');authMode='login';authNotice='';renderMain();"),
              ("if('serviceWorker' in navigator&&document.documentElement.dataset.preview!=='browser')navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'}).then(()=>install.refresh()).catch(()=>{});", "if('serviceWorker' in navigator&&['localhost','127.0.0.1'].includes(location.hostname)){navigator.serviceWorker.getRegistrations().then(registrations=>Promise.all(registrations.map(registration=>registration.unregister()))).catch(()=>{});}else if('serviceWorker' in navigator&&document.documentElement.dataset.preview!=='browser'){navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'}).then(()=>install.refresh()).catch(()=>{});}")
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected legacy fragment: {old[:90]}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm .github/workflows/remove-legacy-startup.yml
          git config user.name "AbujaLife Architecture Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add app/app.js .github/workflows/remove-legacy-startup.yml
          git commit -m "Remove legacy startup calls from client"
          git push origin HEAD:fix/remove-legacy-startup-stack-2026-10-06
