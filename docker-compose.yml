services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abujalife
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: abujalife
    ports: ["5432:5432"]
    volumes:
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - abujalife_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  abujalife_pg:
